<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121110" />
    <title>音乐时刻</title>
    <style>
      html, body { background: #121110; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 3 秒兜底：如果 #root 还是空，说明 JS 没跑起来，给肉眼可见的提示
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.innerHTML.trim() === '') {
          root.innerHTML =
            '<div style="color:#191613;padding:2rem;font-family:monospace;font-size:13px">' +
            '<p>[music-moments] 3 秒后 #root 仍为空</p>' +
            '<p style="margin-top:1rem">请打开浏览器 DevTools（F12）查看 Console 报错，把红色错误信息发给我。</p>' +
            '<p style="margin-top:1rem;opacity:0.7">常见原因：未运行 npm run dev / 端口被占用 / 浏览器拦截了 module 脚本</p>' +
            '</div>'
        }
      }, 3000)
    </script>
  </body>
</html>
